# FROZEN TEST FIXTURE — DO NOT EDIT (values).
#
# Golden scenario tests are pinned to these exact numbers. When payout *values*
# are corrected, add rules_v2.yaml and new scenarios alongside; this file keeps
# passing, which is what proves a rules change did not silently alter behaviour
# already verified.
#
# Migrated once, from base-times-modifier to the flat table below, when real
# payouts showed the monochrome premium is not a constant multiple (2.67x on a
# three-group up to 7x on a triple). A schema change is not a value change: there
# was no way to express the real structure in the old shape, and carrying a dead
# parser forever to preserve a fixture written before we knew the structure would
# have been the worse trade. Values were chosen to mirror the real table's shape.
#
# Deliberately small and unlike the real game: six characters, two groups, and
# payouts chosen so that every ranking case is distinguishable by eye.

version: 1
name: fixture_v1

deck:
  size: 40
  colors: [blue, orange, pink]
  max_per_color: 3
  composition: even_as_possible

characters:
  - {id: a, name: "Alpha"}
  - {id: b, name: "Bravo"}
  - {id: c, name: "Charlie"}
  - {id: d, name: "Delta"}
  - {id: e, name: "Echo"}
  - {id: f, name: "Foxtrot"}

groups:
  - {id: left,  name: "Left",  members: [a, b]}
  - {id: right, name: "Right", members: [c, d, e, f]}

bonus_character: c

play:
  players: 4
  initial_coins: 1000
  hand_limit: 5
  deal_size: 5
  draws_per_turn: 1
  refill_policy: up_to_limit
  chain_allowed: true
  chain_is_optional: true
  claim_moves_turn: false
  discard_after_claim: false
  discard_after_in_turn_call: true
  claimable: most_recent_discard_only

hands:
  - {id: triple, predicate: three_of_a_kind}
  - {id: group,  predicate: full_group}

payouts:
  # Mirrors the real table's shape: a huge monochrome premium on triples (7x) and
  # a modest one on groups, so that a monochrome triple outranks a monochrome
  # small group. Both here and in the real game, nothing may assume groups beat
  # triples.
  table:
    triple: {multi: 100, mono: 700}
    group:
      2: {multi: 50,  mono: 150}     # deliberately cheaper than a triple
      3: {multi: 200, mono: 400}     # and cheaper, monochrome, than a mono triple
      4: {multi: 400, mono: 800}
  bonus:
    per_copy: 50
    applies_to: scoring_set
  claimed_changes_amount: false
  payer:
    when_claimed: discarder
    otherwise: split_others
  caller_gains_full_amount_on_payer_bankruptcy: true

end_conditions:
  deck_empty: true
  coin_floor: 0
  floor_is_asymmetric: true
  multi_round: false

tiebreak:
  order: [payout, turn_order]
