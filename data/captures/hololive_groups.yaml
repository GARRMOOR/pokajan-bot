# Punctuation is normalised away before lookup, so an apostrophe in a filename needs no
# entry here: ninomae_ina'nis resolves on its own, as will any name like it.
#
# This table is only for spellings normalisation cannot reach. It is empty because the
# player renamed the files that needed it -- three names shortened to one word (flare,
# lui, la+_darkness) and one typo (usada_pekore) each appeared once and were fixed at
# source, which is better than carrying a mapping forever.
#
# NEVER replace an entry here with fuzzy matching. That typo was one letter from a real
# holomem, and a resolver willing to close a one-letter gap would as readily map a genuine
# holomem onto the wrong one. `coverage` reports the filename instead, and the player
# fixes it -- which is what happened, and it took one message.
aliases: {}
