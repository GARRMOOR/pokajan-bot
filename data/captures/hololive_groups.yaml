# Card art filenames are typed by hand as captures come in, so they do not always match
# the canonical ids above. Rather than renaming files -- which would have to happen again
# every session -- the resolver in pokajan/vision/roster_panel.py maps them, and reports
# anything it cannot map instead of guessing.
#
# Real cases found in data/cards/: an apostrophe the ids omit, three names shortened to
# one word, and one outright typo. The typo is listed because guessing at it is exactly
# what a resolver must not do -- a one-letter edit could as easily be a different holomem.
aliases:
  "ninomae_ina'nis": ninomae_inanis
  "flare": shiranui_flare
  "lui": takane_lui
  "la+_darkness": laplus_darknesss
  "usada_pekore": usada_pekora        # typo; keep until the file is renamed
