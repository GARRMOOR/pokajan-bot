# The groups the game draws its roster from, and who is in them.
#
# Committed, like data/captures/digits.yaml and unlike anything image-shaped: this is
# public information about a VTuber agency, not data about the people we played against.
#
# WHY THIS FILE EXISTS. The game reveals four groups a round and shows their members as
# head-and-shoulders portraits. Reading those portraits with the card art scores 1/17 --
# they are a different rendering, not a crop -- so recognising them would need a second
# template set of its own. It does not have to: the game uses real hololive branches, so
# knowing *which four groups* were drawn is enough to know the whole roster.
#
# That turns roster reading into a four-way label classification plus a lookup, and the
# `size` below is what checks it. The panel is a fixed 4x5 grid whose unused cells hold a
# flat grey placeholder, so counting real cells needs no recognition at all -- and a count
# that disagrees with the size here means the label was misread. A wrong roster is silent
# and disastrous (see pokajan/core/roster.py), so that disagreement must refuse.
#
# `confirmed: capture` means the membership was transcribed from a real round, not
# recalled. The rest is from public knowledge and is checked against `size` at load; if
# the game ever shows a count that disagrees, trust the game and fix the entry here.
#
# `badge` and `label` are what the card and the panel print, for the classifier to match.

groups:
  - id: gen0
    label: "Gen0"
    badge: "0"
    size: 5
    confirmed: capture
    members: [tokino_sora, roboco, azki, sakura_miko, hoshimachi_suisei]

  - id: gen1
    label: "Gen1"
    badge: "1"
    size: 5
    members: [yozora_mel, aki_rosenthal, akai_haato, natsuiro_matsuri, shirakami_fubuki]

  # Fubuki is in both Gen1 and GAMERS, and her card art carries a per-group variant. The
  # player's judgement is that the game never draws both as goals in one round, so
  # core/roster.py refuses a roster where a holomem appears twice rather than modelling
  # it. If a panel ever shows her in two rows, that refusal is the assumption to revisit.
  - id: gamers
    label: "GAMERS"
    badge: "Ga"
    size: 4
    confirmed: capture
    members: [shirakami_fubuki, ookami_mio, nekomata_okayu, inugami_korone]

