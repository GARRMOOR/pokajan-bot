<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pokajan overlay</title>
<style>
  /* TRANSPARENCY HERE IS A COLOUR KEY, NOT ALPHA.
     pywebview's Windows backend makes a window see-through by setting
     TransparencyKey to pure red, so every pixel that ends up exactly #ff0000
     disappears and lets clicks through. Two consequences that are easy to lose an
     afternoon to:

       * The page background must be exactly #ff0000. Anything else is opaque.
       * Nothing can be semi-transparent. A panel at 85% opacity composites against
         red and lands on a pink that is not the key colour, so instead of a
         tasteful frosted strip you get a solid pink one. The panel is therefore
         fully opaque, and kept small so it covers little.
       * Avoid pure red anywhere in the design or it will punch a hole. The warning
         colour below is #ff6b6b for that reason. */
  html, body {
    margin: 0; padding: 0; background: #ff0000;
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    overflow: hidden; user-select: none; cursor: default;
  }
  /* Sized to content and pinned bottom-left, so an oversized window still shows a
     tight panel rather than a big coloured rectangle. */
  #wrap { position: fixed; left: 0; bottom: 0; padding: 8px; }

  /* Placement mode. The window fills itself with something opaque and outlined, for
     two reasons: you can see the actual window bounds you are positioning, and every
     pixel of it is grabbable. Key-coloured pixels are click-through at the OS level,
     so a transparent area cannot be dragged no matter what listens to it. */
  html.place #wrap {
    inset: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px;
    background: #12151d; border: 2px dashed #a78bfa; border-radius: 10px;
    cursor: move;
  }
  #placebar { display: none; }
  html.place #placebar {
    display: block; color: #c4b5fd; font-size: 12px; letter-spacing: .3px;
  }
  html.place #placebar b { color: #eef1f7; }

  /* A frameless window has no border for Windows to hand out resize edges from, so
     the dashed outline above looks grabbable but is not. This is the real handle,
     and it is drawn large and obvious for exactly that reason. */
  #grip { display: none; }
  html.place #grip {
    display: block; position: fixed; right: 0; bottom: 0; width: 26px; height: 26px;
    cursor: nwse-resize; touch-action: none;
    background:
      linear-gradient(135deg, transparent 46%, #a78bfa 46%, #a78bfa 54%, transparent 54%),
      linear-gradient(135deg, transparent 66%, #a78bfa 66%, #a78bfa 74%, transparent 74%);
  }
  html.place #grip:hover { filter: brightness(1.5); }

  .panel {
    background: #0d1017; border: 1px solid #343d52; border-left: 3px solid #a78bfa;
    border-radius: 9px; padding: 9px 13px; color: #eef1f7;
    max-width: 460px;
  }
  .move { font-size: 17px; font-weight: 700; color: #c4b5fd; letter-spacing: .1px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .bar { width: 92px; height: 5px; border-radius: 3px; background: #232a38;
         overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; }
  .pct { font: 12px/1 ui-monospace, monospace; }
  .tag { font-size: 10.5px; color: #7f8798; letter-spacing: .3px; }
  .why { font-size: 12.5px; color: #cdd3e0; margin-top: 5px; }
  .alts { font: 11px/1.4 ui-monospace, monospace; color: #7f8798; margin-top: 4px; }
  .idle { font-size: 13px; color: #9aa2b4; }

  /* Advice about a position that has moved on is worse than none, because it still
     reads as current. The whole panel dims rather than hiding, so a frozen feed is
     visibly frozen instead of looking like "nothing to advise". */
  .panel.stale { opacity: .45; border-left-color: #6b7280; }
</style>
</head>
<body>
<!-- The drag class is in the markup rather than added by script, and sits on an
     element the renderer never rewrites. pywebview wires its mousedown listeners to
     whatever matches this selector at injection time, so an element created later —
     or replaced later — is not draggable.

     It is on #wrap and not #panel because overlay.js rewrites the panel's contents
     on every update, which would drop the listener on the first hint.

     (pywebview's other drag mode, easy_drag, is broken in 5.3.2: util.py lowercases
     the flag to 'true' and customize.js compares it against 'True'. Passing it does
     nothing, which is how this started out not working.) -->
<div id="wrap" class="pywebview-drag-region">
  <div id="placebar"><b>Placement mode</b> — drag anywhere to move, corner to resize.
    Close the window to save.</div>
  <div class="panel" id="panel"><div class="idle">Connecting…</div></div>
</div>
<div id="grip" title="Resize"></div>
<script src="/static/overlay.js"></script>
</body>
</html>
